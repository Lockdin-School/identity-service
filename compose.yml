name: lockdin-school
services:
  identity-service:
    build: .
    container_name: identity-service
    expose:
      - "8080"
    env_file:
      - .env.local
    networks:
      - lockdin-network
      - iden-sn
    depends_on:
      - identityDB

  identityDB:
    container_name: identity-db
    image: postgres:16-alpine
    command: -p 5435
    ports:
      - "5435:5435"
    env_file:
      - .env.local
    networks:
      - iden-sn
    volumes:
      - type: volume
        source: identity-storage
        target: /var/lib/postgresql/identity/data


volumes:
  identity-storage:

networks:
  iden-sn: